<div class="output-summary">
  <div class="d-flex flex-column">
    @for (psat of psats; track psat.name) {
      <app-sankey-scenario-picker [options]="psatOptions" [selected]="psat"
        (selectedChange)="setPsat($event)" [costSavings]="psatCostSavings">
        <app-psat-sankey [psat]="psat" [settings]="settings" [isBaseline]="psatBaseline"></app-psat-sankey>
      </app-sankey-scenario-picker>
    }
  </div>
</div>
