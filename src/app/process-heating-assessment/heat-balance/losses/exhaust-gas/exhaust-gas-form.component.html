<form [formGroup]="form()">
  <div class="form-section">
    <div class="form-group">
      <label class="small" for="{{controlIds().offGasTemp}}">Off (Exhaust) Gas Temp</label>
      <div class="input-group" [class.invalid]="form().controls.offGasTemp.invalid">
        <input type="number" step="10" class="form-control"
          id="{{controlIds().offGasTemp}}" formControlName="offGasTemp" onfocus="this.select();">
        <span class="input-group-addon units">{{settings().unitsOfMeasure === 'Imperial' ? '℉' : '℃'}}</span>
      </div>
      <app-form-control-errors [control]="form().controls.offGasTemp" [settings]="settings()">
      </app-form-control-errors>
    </div>
    <div class="form-group">
      <label class="small" for="{{controlIds().CO}}">CO</label>
      <div class="input-group" [class.invalid]="form().controls.CO.invalid">
        <input type="number" step="any" class="form-control"
          id="{{controlIds().CO}}" formControlName="CO" onfocus="this.select();">
        <span class="input-group-addon units">%</span>
      </div>
      <app-form-control-errors [control]="form().controls.CO" [settings]="settings()">
      </app-form-control-errors>
    </div>
    <div class="form-group">
      <label class="small" for="{{controlIds().H2}}">H2</label>
      <div class="input-group" [class.invalid]="form().controls.H2.invalid">
        <input type="number" step="any" class="form-control"
          id="{{controlIds().H2}}" formControlName="H2" onfocus="this.select();">
        <span class="input-group-addon units">%</span>
      </div>
      <app-form-control-errors [control]="form().controls.H2" [settings]="settings()">
      </app-form-control-errors>
    </div>
    <div class="form-group">
      <label class="small" for="{{controlIds().combustibleGases}}">Combustible Gas as CH4</label>
      <div class="input-group" [class.invalid]="form().controls.combustibleGases.invalid">
        <input type="number" step="any" class="form-control"
          id="{{controlIds().combustibleGases}}" formControlName="combustibleGases" onfocus="this.select();">
        <span class="input-group-addon units">%</span>
      </div>
      <app-form-control-errors [control]="form().controls.combustibleGases" [settings]="settings()">
      </app-form-control-errors>
    </div>
    <div class="form-group">
      <label class="small" for="{{controlIds().vfr}}">Total Volumetric Flow Rate</label>
      <div class="input-group" [class.invalid]="form().controls.vfr.invalid">
        <input type="number" step="10" class="form-control"
          id="{{controlIds().vfr}}" formControlName="vfr" onfocus="this.select();">
        <span class="input-group-addon units">@if (settings().unitsOfMeasure === 'Imperial') { cfm } @else { m<sup>3</sup>/min }</span>
      </div>
      <app-form-control-errors [control]="form().controls.vfr" [settings]="settings()">
      </app-form-control-errors>
    </div>
    <div class="form-group">
      <label class="small" for="{{controlIds().dustLoading}}">Dust Loading</label>
      <div class="input-group" [class.invalid]="form().controls.dustLoading.invalid">
        <input type="number" step="any" class="form-control"
          id="{{controlIds().dustLoading}}" formControlName="dustLoading" onfocus="this.select();">
        <span class="input-group-addon units">@if (settings().unitsOfMeasure === 'Imperial') { lb/scf } @else { kg/Nm<sup>3</sup> }</span>
      </div>
      <app-form-control-errors [control]="form().controls.dustLoading" [settings]="settings()">
      </app-form-control-errors>
    </div>
  </div>
</form>
