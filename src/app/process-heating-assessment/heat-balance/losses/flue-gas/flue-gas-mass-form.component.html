@let f = form().controls;

@if (materialSelector.missingMaterialId() !== null) {
  <div class="alert alert-warning">
    This entry references a material that no longer exists in the Process Heating Materials Database.
    <button type="button" class="btn btn-link p-0 ml-1" (click)="materialSelector.restoreDeletedMaterial()">Restore it</button>
    or
    <button type="button" class="btn btn-link p-0 ml-1" (click)="materialSelector.dismissMissingMaterial()">dismiss and continue with the stored values</button>.
  </div>
}

<form [formGroup]="form()">
  <div class="form-group">
    <label for="materialId_{{ instanceId() }}">Fuel</label>
    <select class="form-control" id="materialId_{{ instanceId() }}" formControlName="materialId"
      (change)="materialSelector.onMaterialSelected(f.materialId.value)">
      @for (material of materialSelector.materialTypes(); track material.id) {
        <option [ngValue]="material.id">{{ material.substance }}</option>
      }
    </select>
    <button type="button" class="btn btn-link p-0 form-text small" (click)="materialSelector.openAddMaterialModal()">Add New...</button>
    <app-form-control-errors [control]="f.materialId" [settings]="settings()"></app-form-control-errors>
  </div>

  <app-flue-gas-conditions-fields [form]="form()" [settings]="settings()" [instanceId]="instanceId()"></app-flue-gas-conditions-fields>

  <div class="form-group">
    <label for="ashDischargeTemperature_{{ instanceId() }}">Ash Discharge Temperature</label>
    <div class="input-group" [class.invalid]="f.ashDischargeTemperature.invalid">
      <input type="number" step="10" class="form-control" id="ashDischargeTemperature_{{ instanceId() }}" formControlName="ashDischargeTemperature" onfocus="this.select();">
      <app-input-unit [settings]="settings()" imperialUnit="&#8457;" metricUnit="&#8451;"></app-input-unit>
    </div>
    <app-form-control-errors [control]="f.ashDischargeTemperature" [settings]="settings()"></app-form-control-errors>
  </div>

  <div class="form-group">
    <label for="unburnedCarbonInAsh_{{ instanceId() }}">Unburned Carbon in Ash</label>
    <div class="input-group" [class.invalid]="f.unburnedCarbonInAsh.invalid">
      <input type="number" step="0.1" class="form-control" id="unburnedCarbonInAsh_{{ instanceId() }}" formControlName="unburnedCarbonInAsh" onfocus="this.select();">
      <span class="input-group-addon units">%</span>
    </div>
    <app-form-control-errors [control]="f.unburnedCarbonInAsh" [settings]="settings()"></app-form-control-errors>
  </div>

  <h6 class="mt-3">Fuel Analysis (% by mass)</h6>
  @for (component of fuelAnalysis; track component.key) {
    <div class="form-group">
      <label for="{{ component.key }}_{{ instanceId() }}">{{ component.label }}</label>
      <div class="input-group" [class.invalid]="form().controls[component.key].invalid">
        <input type="number" step="0.01" class="form-control" id="{{ component.key }}_{{ instanceId() }}" [formControlName]="component.key" onfocus="this.select();">
        <span class="input-group-addon units">%</span>
      </div>
      <app-form-control-errors [control]="form().controls[component.key]" [settings]="settings()"></app-form-control-errors>
    </div>
  }
</form>
