@let f = form().controls;

@if (materialSelector.missingMaterialId() !== null) {
  <div class="alert alert-warning">
    This entry references a material that no longer exists in the Process Heating Materials Database.
    <button type="button" class="btn btn-link p-0 ml-1" (click)="materialSelector.restoreDeletedMaterial()">Restore it</button>
    or
    <button type="button" class="btn btn-link p-0 ml-1" (click)="materialSelector.dismissMissingMaterial()">dismiss and continue with the stored values</button>.
  </div>
}

<form [formGroup]="form()">
  <div class="form-section">
    <ng-content></ng-content>
    <div class="form-group">
      <label for="materialId_{{ instanceId() }}">Fuel
        <button type="button" class="btn btn-link p-0 d-block small" (click)="materialSelector.openAddMaterialModal()">Add New Fuel</button>
      </label>
      <select class="form-control" id="materialId_{{ instanceId() }}" formControlName="materialId" (focus)="focusField('gasTypeId')" [class.indicate-different]="massDifferences().has('gasTypeId')"
        (change)="materialSelector.onMaterialSelected(f.materialId.value)" [class.invalid]="f.materialId.invalid">
        @for (material of materialSelector.materialTypes(); track material.id) {
          <option [ngValue]="material.id">{{ material.substance }}</option>
        }
      </select>
      <app-form-control-errors [control]="f.materialId" [settings]="settings()"></app-form-control-errors>
    </div>

    <app-flue-gas-conditions-fields [form]="form()" [differingFields]="massDifferences()" [warnings]="warnings()" [settings]="settings()" [instanceId]="instanceId()"></app-flue-gas-conditions-fields>

    <div class="form-group">
      <label for="ashDischargeTemperature_{{ instanceId() }}">Ash Discharge Temperature</label>
      <div class="input-group" [class.invalid]="f.ashDischargeTemperature.invalid" [class.indicate-different]="massDifferences().has('ashDischargeTemperature')">
        <input type="number" step="10" class="form-control" id="ashDischargeTemperature_{{ instanceId() }}" formControlName="ashDischargeTemperature" (focus)="focusField('ashDischargeTemperature')" onfocus="this.select();">
        <app-input-unit [settings]="settings()" imperialUnit="&#8457;" metricUnit="&#8451;"></app-input-unit>
      </div>
      <app-form-control-errors [control]="f.ashDischargeTemperature" [settings]="settings()"></app-form-control-errors>
    </div>

    <div class="form-group">
      <label for="unburnedCarbonInAsh_{{ instanceId() }}">Unburned Carbon in Ash</label>
      <div class="input-group" [class.invalid]="f.unburnedCarbonInAsh.invalid" [class.indicate-different]="massDifferences().has('unburnedCarbonInAsh')">
        <input type="number" step="0.1" class="form-control" id="unburnedCarbonInAsh_{{ instanceId() }}" formControlName="unburnedCarbonInAsh" (focus)="focusField('unburnedCarbonInAsh')" onfocus="this.select();">
        <span class="input-group-addon units">%</span>
      </div>
      <app-form-control-errors [control]="f.unburnedCarbonInAsh" [settings]="settings()"></app-form-control-errors>
      @if (warnings()?.unburnedCarbonInAshWarning; as warning) {
        <div class="alert-warning small">{{ warning }}</div>
      }
    </div>
  </div>
</form>
