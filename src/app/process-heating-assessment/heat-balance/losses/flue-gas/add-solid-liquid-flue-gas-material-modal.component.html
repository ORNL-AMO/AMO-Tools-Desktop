<div class="modal-header">
  <h4 class="modal-title">Add New Fuel</h4>
</div>
<div class="modal-body">
  <form [formGroup]="form">
    <div class="form-group">
      <label for="substance">Material Name</label>
      <input type="text" class="form-control" id="substance" formControlName="substance">
      <app-form-control-errors [control]="form.controls.substance" [settings]="settings"></app-form-control-errors>
    </div>
    @for (component of fuelAnalysis; track component.key) {
      <div class="form-group">
        <label for="{{ component.key }}">{{ component.label }}</label>
        <div class="input-group">
          <input type="number" step="0.01" class="form-control" id="{{ component.key }}" [formControlName]="component.key">
          <span class="input-group-addon units">%</span>
        </div>
        <app-form-control-errors [control]="form.controls[component.key]" [settings]="settings"></app-form-control-errors>
      </div>
    }
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-white" (click)="close()">Cancel</button>
  <button type="button" class="btn btn-primary" [disabled]="form.invalid" (click)="save()">Save</button>
</div>
