@let f = form().controls;

@if (materialSelector.missingMaterialId() !== null) {
  <div class="alert alert-warning">
    This entry references a material that no longer exists in the Process Heating Materials Database.
    <button type="button" class="btn btn-link p-0 ml-1" (click)="materialSelector.restoreDeletedMaterial()">Restore it</button>
    or
    <button type="button" class="btn btn-link p-0 ml-1" (click)="materialSelector.dismissMissingMaterial()">dismiss and continue with the stored values</button>.
  </div>
}

<form [formGroup]="form()">
  <div class="form-section">
    <ng-content></ng-content>
    <div class="form-group">
      <label for="materialId_{{ instanceId() }}">Fuel
        <button type="button" class="btn btn-link p-0 d-block small" (click)="materialSelector.openAddMaterialModal()">Add New Fuel</button>
      </label>
      <select class="form-control" id="materialId_{{ instanceId() }}" formControlName="materialId" (focus)="focusField('gasTypeId')" [class.indicate-different]="volumeDifferences().has('gasTypeId')"
        (change)="materialSelector.onMaterialSelected(f.materialId.value)" [class.invalid]="f.materialId.invalid">
        @for (material of materialSelector.materialTypes(); track material.id) {
          <option [ngValue]="material.id">{{ material.substance }}</option>
        }
      </select>
      <app-form-control-errors [control]="f.materialId" [settings]="settings()"></app-form-control-errors>
    </div>

    <app-flue-gas-conditions-fields [form]="form()" [differingFields]="volumeDifferences()" [warnings]="warnings()" [settings]="settings()" [instanceId]="instanceId()"></app-flue-gas-conditions-fields>
  </div>
</form>
