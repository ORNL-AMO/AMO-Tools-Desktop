<div class="modal-header">
  <h4 class="modal-title">Add New Gas Material</h4>
</div>
<div class="modal-body">
  <section class="section">
    <div class="row-field">
      <label for="existingMaterial">Start with existing material</label>
      <select class="form-control" id="existingMaterial" #existingMaterial
        (change)="applyExistingMaterial(materials()[existingMaterial.selectedIndex - 1])">
        <option></option>
        @for (material of materials(); track material.id) {
          <option>{{ material.substance }}</option>
        }
      </select>
    </div>
  </section>

  <form class="section" [formGroup]="form">
    <div class="row-field">
      <label for="substance">Material Name</label>
      <input type="text" class="form-control" id="substance" formControlName="substance">
      <app-form-control-errors class="field-errors" [control]="form.controls.substance" [settings]="settings"></app-form-control-errors>
    </div>
    <div class="row-field">
      <label for="specificHeatVapor">Specific Heat of Gas</label>
      <div class="input-group">
        <input type="number" class="form-control" id="specificHeatVapor" formControlName="specificHeatVapor">
        <app-input-unit [settings]="settings" [imperialUnit]="'Btu/(lb-&#8457;)'" [metricUnit]="'kJ/(kg-&#8451;)'"></app-input-unit>
      </div>
      <app-form-control-errors class="field-errors" [control]="form.controls.specificHeatVapor" [settings]="settings"></app-form-control-errors>
    </div>
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-white" (click)="close()">Cancel</button>
  <button type="button" class="btn btn-primary" [disabled]="form.invalid" (click)="save()">Save</button>
</div>
