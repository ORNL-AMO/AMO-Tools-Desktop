<form [formGroup]="form()">
  <div class="form-section">
    <div class="form-group">
      <label class="small" for="{{controlIds().motorPhase}}">Motor Current Phase(s)</label>
      <select class="form-control" id="{{controlIds().motorPhase}}" formControlName="motorPhase"
        [class.invalid]="form().controls.motorPhase.invalid">
        @for (phase of motorPhases; track phase) {
          <option [ngValue]="phase">{{phase}}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label class="small" for="{{controlIds().supplyVoltage}}">Supply Voltage</label>
      <div class="input-group" [class.invalid]="form().controls.supplyVoltage.invalid">
        <input type="number" step="10" class="form-control"
          id="{{controlIds().supplyVoltage}}" formControlName="supplyVoltage" onfocus="this.select();">
        <span class="input-group-addon units">V</span>
      </div>
      <app-form-control-errors [control]="form().controls.supplyVoltage" [settings]="settings()">
      </app-form-control-errors>
      @if (warnings()?.voltageWarning; as warning) {
        <span class="alert-warning pull-right small">{{warning}}</span>
      }
    </div>

    <div class="form-group">
      <label class="small" for="{{controlIds().avgCurrent}}">Average Current</label>
      <div class="input-group" [class.invalid]="form().controls.avgCurrent.invalid">
        <input type="number" step="10" class="form-control"
          id="{{controlIds().avgCurrent}}" formControlName="avgCurrent" onfocus="this.select();">
        <span class="input-group-addon units">A</span>
      </div>
      <app-form-control-errors [control]="form().controls.avgCurrent" [settings]="settings()">
      </app-form-control-errors>
    </div>

    <div class="form-group">
      <label class="small" for="{{controlIds().powerFactor}}">Power Factor</label>
      <input type="number" step="0.1" class="form-control"
        id="{{controlIds().powerFactor}}" formControlName="powerFactor" onfocus="this.select();"
        [class.invalid]="form().controls.powerFactor.invalid">
      <app-form-control-errors [control]="form().controls.powerFactor" [settings]="settings()">
      </app-form-control-errors>
    </div>

    <div class="form-group">
      <label class="small" for="{{controlIds().operatingTime}}">Operating Time</label>
      <div class="input-group" [class.invalid]="form().controls.operatingTime.invalid">
        <input type="number" step="any" class="form-control"
          id="{{controlIds().operatingTime}}" formControlName="operatingTime" onfocus="this.select();">
        <span class="input-group-addon units">%</span>
      </div>
      <app-form-control-errors [control]="form().controls.operatingTime" [settings]="settings()">
      </app-form-control-errors>
    </div>
  </div>
</form>
