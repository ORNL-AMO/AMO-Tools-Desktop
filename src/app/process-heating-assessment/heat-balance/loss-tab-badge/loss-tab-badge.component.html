@if (count() || invalid() || needsVisit()) {
  <span class="badge gray-badge" [class.success]="!invalid() && !needsVisit()" [class.missing-data]="invalid()"
    [class.input-error]="needsVisit() && !invalid()">
    @if (count() === undefined || needsVisit()) {
      <span class="fa fa-exclamation"></span>
    } @else {
      <strong>{{count()}}</strong>
    }
  </span>
}
