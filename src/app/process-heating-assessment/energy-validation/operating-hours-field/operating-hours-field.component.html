<div class="form-group">
  <label class="small" [for]="inputId()">Operating Hours</label>
  <div class="input-group" [class.invalid]="operatingHours().invalid">
    <span class="input-group-addon units">
      <a class="click-link" (click)="openOperatingHoursModal()"><span class="fa fa-calculator"></span></a>
    </span>
    <input type="number" step="any" class="form-control" [id]="inputId()" [formControl]="operatingHours()"
      (focus)="focusField()" onfocus="this.select();">
    <span class="input-group-addon units">hrs/yr</span>
  </div>
  <app-form-control-errors [control]="operatingHours()" [settings]="settings()" defaultUnit="hrs/yr"></app-form-control-errors>
</div>
