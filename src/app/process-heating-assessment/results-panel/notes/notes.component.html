@if (notesKey()) {
  <div class="note-form">
    <textarea
      rows="6"
      id="notes"
      [value]="note()"
      [placeholder]="placeholder()"
      (input)="save($any($event.target).value)"
    ></textarea>
  </div>
} @else {
  <div class="p-2 pt-3 d-flex flex-column help-info">
    <h5>
      Explore Opportunities Notes
      <br>
      <small class="text-muted">Select a loss type to edit notes.</small>
    </h5>
    <hr class="my-1 hr-spacer">
  </div>
}
