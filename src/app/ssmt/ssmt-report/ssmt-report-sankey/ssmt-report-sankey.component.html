<div class="output-summary">
    <div class="d-flex flex-column">
        @for (ssmt of ssmts; track ssmt.name) {
          <app-sankey-scenario-picker [options]="ssmtOptions" [selected]="ssmt" (selectedChange)="setSsmt($event)"
              [costSavings]="ssmtCostSavings">
              <app-ssmt-sankey [ssmt]="ssmt" [assessment]="assessment" [settings]="settings"
                  [isBaseline]="ssmtBaseline"></app-ssmt-sankey>
          </app-sankey-scenario-picker>
        }
    </div>
</div>
