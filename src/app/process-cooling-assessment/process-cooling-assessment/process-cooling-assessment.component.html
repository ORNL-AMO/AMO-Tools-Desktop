<div class="ly-shell ly-theme-process-cooling process-cooling-container process-cooling-assessment">
  <div class="w-100 hide-print" id="processCoolingBanner">
    <app-process-cooling-banner></app-process-cooling-banner>
  </div>

  <router-outlet></router-outlet>

  <div id="processCoolingFooter" class="footer hide-print ly-wide-only">
    <div class="pull-left">
      <button class="btn btn-default" (click)="back()" [disabled]="!canGoBack()">Back</button>
    </div>
    <div class="pull-right">
      <button class="btn btn-primary" (click)="next()" [disabled]="!canContinue()">Next</button>
    </div>
  </div>

</div>


@if (showWelcomeScreen) {<app-welcome-screen (emitClose)="closeWelcomeScreen()"></app-welcome-screen>}
