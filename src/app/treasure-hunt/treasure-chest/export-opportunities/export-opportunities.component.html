<div bsModal #exportModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="exportModalLabel"
    aria-hidden="true" [config]="{backdrop: 'static'}" (onHidden)="onExportModalHidden()">
    <div class="modal-dialog modal-lg export-modal">
        <div class="modal-content">
            <div class="modal-header">
                Data to be exported
                <button class="close" aria-label="Close" (click)="hideExportModal()">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body pb-0 scroll-item">
                <div class="row no-gutters">
                    <ng-container *ngFor="let section of previewSections">
                        <div class="col-6 p-2" *ngIf="treasureHunt[section.key]?.length > 0">
                            <label>{{section.label}}</label>
                            <ul>
                                <li *ngFor="let opportunity of treasureHunt[section.key]; let index = index;"
                                    [class.not-exported]="!opportunity.selected && !includeUnselected"
                                    [attr.title]="opportunity.selected || includeUnselected ? null : 'Not selected for export'">
                                    {{getOpportunityName(section, opportunity, index)}}
                                </li>
                            </ul>
                        </div>
                    </ng-container>
                </div>
            </div>
            <div class="modal-footer export-footer flex-wrap justify-content-between">
                <button class="btn btn-secondary" (click)="hideExportModal()">Cancel</button>
                <div class="export-controls d-flex flex-wrap align-items-center justify-content-end ml-auto">
                    <div class="form-group d-flex align-items-center my-1 mr-3" *ngIf="hasUnselectedOpportunities">
                        <label for="includeUnselected" class="mb-0 mr-2">Include unselected:</label>
                        <input name="includeUnselected" id="includeUnselected" type="checkbox" [(ngModel)]="includeUnselected">
                    </div>
                    <div class="form-group d-flex align-items-center my-1 mr-2">
                        <label for="exportName" class="mb-0 mr-2">Name your file:</label>
                        <input type="text" class="form-control" id="exportName" [(ngModel)]="exportName">
                    </div>
                </div>
                <button class="btn btn-primary my-1 ml-2" (click)="exportData()">Export as .json</button>
            </div>
        </div>
    </div>
</div>
