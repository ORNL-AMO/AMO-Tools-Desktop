<div class="output-summary">
  <div class="d-flex flex-column">
    @for (phast of phasts; track phast.name) {
      <app-sankey-scenario-picker [options]="phastOptions" [selected]="phast" (selectedChange)="setPhast($event)"
        [costSavings]="phastCostSavings" [energySavings]="phastEnergySavings" [energySavingsUnit]="energySavingsUnit"
        [stackVertically]="showPrint">
        <app-phast-sankey [phast]="phast" [settings]="settings"></app-phast-sankey>
      </app-sankey-scenario-picker>
    }
  </div>
</div>
