<div class="output-summary">
  <div class="d-flex flex-column">
    @for (sankeyScenario of sankeyScenarios; track sankeyScenario) {
      <app-sankey-scenario-picker [options]="phastOptions" [selected]="sankeyScenario.scenario" (selectedChange)="setPhast(sankeyScenario, $event)"
        [costSavings]="sankeyScenario.costSavings" [energySavings]="sankeyScenario.energySavings" [energySavingsUnit]="energySavingsUnit"
        [stackVertically]="showPrint">
        <app-phast-sankey [phast]="sankeyScenario.scenario" [settings]="settings"></app-phast-sankey>
      </app-sankey-scenario-picker>
    }
  </div>
</div>
