<div class="output-summary">
  <div class="d-flex flex-column">
    @for (sankeyScenario of sankeyScenarios; track sankeyScenario) {
      <app-sankey-scenario-picker [options]="fsatOptions" [selected]="sankeyScenario.scenario"
        (selectedChange)="setFsat(sankeyScenario, $event)" [costSavings]="sankeyScenario.costSavings">
        <app-fsat-sankey [fsat]="sankeyScenario.scenario" [settings]="settings" [isBaseline]="sankeyScenario.isBaseline"></app-fsat-sankey>
      </app-sankey-scenario-picker>
    }
  </div>
</div>
