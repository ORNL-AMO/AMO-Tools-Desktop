<div class="output-summary">
  <div class="d-flex flex-column">
    @for (fsat of fsats; track fsat.name) {
      <app-sankey-scenario-picker [options]="fsatOptions" [selected]="fsat"
        (selectedChange)="setFsat($event)" [costSavings]="fsatCostSavings">
        <app-fsat-sankey [fsat]="fsat" [settings]="settings" [isBaseline]="fsatBaseline"></app-fsat-sankey>
      </app-sankey-scenario-picker>
    }
  </div>
</div>
